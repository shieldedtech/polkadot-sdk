[package]
name = "sc-network-iroh-transport"
version = "0.1.0"
description = "Experimental iroh (QUIC) transport for the Substrate libp2p network backend"
license = "MIT"
authors = ["Zacharias Boehler", "Parity Technologies <admin@parity.io>"]
homepage.workspace = true
repository.workspace = true
edition = "2024"
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
libp2p = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync"] }
iroh = { workspace = true }
actor-helper = { workspace = true }
